name: E2E — All Roles

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin Tests
        run: npx playwright test --project=admin --project=admin-login --reporter=json,html
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Upload Admin Results (for QA Dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-admin
          path: |
            results.json
            test-results/
          retention-days: 30

      - name: Upload Admin HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin
          path: playwright-report/
          retention-days: 30

  manager-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Manager Tests
        run: npx playwright test --project=manager --project=manager-login --reporter=json,html
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Upload Manager Results (for QA Dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-manager
          path: |
            results.json
            test-results/
          retention-days: 30

      - name: Upload Manager HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-manager
          path: playwright-report/
          retention-days: 30
