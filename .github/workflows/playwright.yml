name: Run Playwright Tests

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --reporter=json,html
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json   # writes JSON report to results.json

      - name: Upload Playwright Results (for QA Dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results        # ← dashboard looks for this exact name
          path: |
            results.json
            test-results/
          retention-days: 30

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30